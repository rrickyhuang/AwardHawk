[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awardhawk"
version = "0.1.0"
description = "Points & miles award deal finder: combines award availability, transfer bonuses, and cash-fare baselines into ranked CPP value."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
